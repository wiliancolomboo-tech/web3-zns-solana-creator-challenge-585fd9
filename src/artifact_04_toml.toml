[package]
name = "zns-creator-core"
version = "0.1.0"
description = "ZNS Solana Creator Infrastructure Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "zns_creator_core"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
solana-program = "1.18"
thiserror = "1.0"